name: Terraform Azure CI/CD

on:
  push:
    branches:
      - feature/rg_sun
      - feature/rg_moon
      - main

permissions:
  contents: read

jobs:

  # ==========================================================
  # FEATURE BRANCH
  # FMT + INIT + SCAN + PLAN
  # ==========================================================
  terraform-plan:

    if: startsWith(github.ref, 'refs/heads/feature/')

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./Parent_Module

    steps:

      # ------------------------------------------------------
      # Checkout
      # ------------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # Azure Login
      # ------------------------------------------------------
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # ------------------------------------------------------
      # Terraform Setup
      # ------------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # ------------------------------------------------------
      # Terraform Format Check
      # ------------------------------------------------------
      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      # ------------------------------------------------------
      # Terraform Init
      # ------------------------------------------------------
      - name: Terraform Init
        run: terraform init

      # ------------------------------------------------------
      # Terraform Security Scan
      # ------------------------------------------------------
      - name: Terraform Security Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          hide-progress: true
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH

      # ------------------------------------------------------
      # Terraform Plan
      # ------------------------------------------------------
      - name: Terraform Plan
        run: terraform plan


  # ==========================================================
  # MAIN BRANCH
  # INIT + PLAN + APPLY
  # ==========================================================
  terraform-apply:

    if: github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    environment:
      name: production

    defaults:
      run:
        working-directory: ./Parent_Module

    steps:

      # ------------------------------------------------------
      # Checkout
      # ------------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # Azure Login
      # ------------------------------------------------------
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # ------------------------------------------------------
      # Terraform Setup
      # ------------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # ------------------------------------------------------
      # Terraform Init
      # ------------------------------------------------------
      - name: Terraform Init
        run: terraform init

      # ------------------------------------------------------
      # Terraform Plan
      # ------------------------------------------------------
      - name: Terraform Plan
        run: terraform plan -out=tfplan

      # ------------------------------------------------------
      # Terraform Apply
      # ------------------------------------------------------
      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan